; PlatformIO Project Configuration File

[common]
build_flags = -Iinclude -I../melodi/src/proto
lib_deps =
    SPI
    ./ext/RadioHead-master.zip

[env:ttgo]
platform = espressif32
board = ttgo-lora32-v2
framework = arduino
build_flags = ${common.build_flags} -D LILYGO_TTGO_LORA32_V2
lib_deps = ${common.lib_deps}

[env:m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino
board_build.mcu = samd21g18a
board_build.f_cpu = 48000000L
upload_protocol = sam-ba
build_flags = ${common.build_flags} -D ADAFRUIT_FEATHER_M0
lib_deps = ${common.lib_deps}

[env:rpi]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather_rfm
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
upload_protocol = picotool
build_flags = ${common.build_flags} -D ARDUINO_ADAFRUIT_FEATHER_RP2040_RFM
lib_deps = ${common.lib_deps}
